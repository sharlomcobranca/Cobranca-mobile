name: Gerar APK Android Automático
on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache nativo do Gradle (evita rebaixar dependências do Android)
      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # Cache do Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Aceitar Licenças do Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Cache do Pip (Python)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet supabase

      # 1. Injeta a versão no main.py
      - name: Injetar Versao Automatica no main.py
        run: |
          sed -i 's/VERSAO_ATUAL_APP = ".*"/VERSAO_ATUAL_APP = "1.0.${{ github.run_number }}"/' main.py

      # 2. Compila o APK ultra-rápido focado em ARM64 (Celulares modernos)
      - name: Compilar APK
        run: |
          flet build apk --python-version 3.12 --arch arm64-v8a

      # 3. Disponibiliza o APK na aba Actions (Artifacts)
      - name: Disponibilizar no Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v1.0.${{ github.run_number }}
          path: build/apk/*.apk

      # 4. Cria o Release público no GitHub
      - name: Criar GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versão 1.0.${{ github.run_number }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Atualiza o Supabase
      - name: Atualizar Versao no Supabase
        run: |
          curl -X PATCH 'https://vccshrmzbubwzmfdgzqi.supabase.co/rest/v1/configuracoes?id=eq.1' \
          -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjY3Nocm16YnVid3ptZmRnenFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5OTcwMTQsImV4cCI6MjEwMDU3MzAxNH0.3RmDObR5_YfTTN87Yl7QwMEmTQh09JVRCakzGIfqHCE" \
          -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjY3Nocm16YnVid3ptZmRnenFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5OTcwMTQsImV4cCI6MjEwMDU3MzAxNH0.3RmDObR5_YfTTN87Yl7QwMEmTQh09JVRCakzGIfqHCE" \
          -H "Content-Type: application/json" \
